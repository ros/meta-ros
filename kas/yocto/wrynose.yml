header:
  version: 14

defaults:
  repos:
    branch: "wrynose"

# https://downloads.yoctoproject.org/releases/yocto/yocto-6.0.3/RELEASENOTES
repos:
  openembedded-core:
    url: "https://github.com/openembedded/openembedded-core.git"
    commit: "ef022bf82d79015802309d14c28b13373ebe53f5"
    path: "layers/openembedded-core"
    layers:
      meta:

  bitbake:
    url: "https://github.com/openembedded/bitbake.git"
    branch: "2.18"
    commit: "fae9db3168dbff1b8c76fe9c6726a9687ff97514"
    path: "layers/bitbake"
    layers:
      bitbake: "disabled"

  meta-yocto:
    url: "https://git.yoctoproject.org/meta-yocto"
    commit: "1b132647002eea43a2c7a7f857f63f42dacbc26c"
    path: "layers/meta-yocto"
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    commit: "14282a02be9c74a1276a7cda7d6c89e054699a11"
    path: "layers/meta-openembedded"
    layers:
      meta-filesystems:
      meta-gnome:
      meta-initramfs:
      meta-multimedia:
      meta-networking:
      meta-oe:
      meta-perl:
      meta-python:
      meta-webserver:
      meta-xfce:

local_conf_header:
  distro: |
    ERROR_QA:remove = "license-exists"
