header:
  version: 14

defaults:
  repos:
    branch: "wrynose"

# https://downloads.yoctoproject.org/releases/yocto/yocto-6.0.4/RELEASENOTES
repos:
  openembedded-core:
    url: "https://github.com/openembedded/openembedded-core.git"
    commit: "a2cc1f5b86f3cdc9ad3257a2545322c5169da3ca"
    path: "layers/openembedded-core"
    layers:
      meta:

  bitbake:
    url: "https://github.com/openembedded/bitbake.git"
    branch: "2.18"
    commit: "51fd94a67fa17650a9ff623492005972bbc7d26f"
    path: "layers/bitbake"
    layers:
      bitbake: "disabled"

  meta-yocto:
    url: "https://git.yoctoproject.org/meta-yocto"
    commit: "7c25b11156553145fa6b241a2d4f65d94438f804"
    path: "layers/meta-yocto"
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    commit: "f28a144aa0a0ae05ca2ee91e1aef6aa05f6a12db"
    path: "layers/meta-openembedded"
    layers:
      meta-filesystems:
      meta-gnome:
      meta-initramfs:
      meta-multimedia:
      meta-networking:
      meta-oe:
      meta-perl:
      meta-python:
      meta-webserver:
      meta-xfce:

local_conf_header:
  distro: |
    ERROR_QA:remove = "license-exists"
