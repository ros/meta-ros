header:
  version: 14

defaults:
  repos:
    branch: "blacksail"

# https://downloads.yoctoproject.org/releases/yocto/yocto-6.1/RELEASENOTES
repos:
  openembedded-core:
    url: "https://github.com/openembedded/openembedded-core.git"
    commit: "419c1b0f1ed0e3ce22b1022061f763d007883121"
    path: "layers/openembedded-core"
    layers:
      meta:

  bitbake:
    url: "https://github.com/openembedded/bitbake.git"
    branch: "2.20"
    commit: "634f8dede6b9d71b5a6691499fd05a8678b46eae"
    path: "layers/bitbake"
    layers:
      bitbake: "disabled"

  meta-yocto:
    url: "https://git.yoctoproject.org/meta-yocto"
    commit: "43946d08974e61361f6313ae348c5d87c12be934"
    path: "layers/meta-yocto"
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    commit: "bb956bf8ff7a32f31deaa83e96880d10ab564d14"
    path: "layers/meta-openembedded"
    layers:
      meta-filesystems:
      meta-gnome:
      meta-initramfs:
      meta-multimedia:
      meta-networking:
      meta-oe:
      meta-perl:
      meta-python:
      meta-webserver:
      meta-xfce:

local_conf_header:
  distro: |
    ERROR_QA:remove = "license-exists"
