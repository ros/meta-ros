BB_CONF_FRAGMENT_SUMMARY = "Enable Fortran support for ROS packages that need lapack"
BB_CONF_FRAGMENT_DESCRIPTION = "Build the Fortran compiler and runtime \
(gfortran, libgfortran, libquadmath). meta-oe's lapack needs libgfortran, and \
through it suitesparse, coinor, ipopt, pagmo, dartsim and ceres-solver's \
lapack/suitesparse support. Without this fragment those recipes are skipped \
(see the 'fortran' group in ROS_WORLD_SKIP_GROUPS). Enabling Fortran changes \
the task signatures of gcc-cross and everything built from it, so it is opt-in. \
Note that Fortran support is not officially supported by OpenEmbedded."

# FORTRAN support (derived from openembedded-core/meta/conf/local.conf.sample.extended)
FORTRAN:forcevariable = ",fortran"
RUNTIMETARGET:append:pn-gcc-runtime = " libquadmath"
